name: Part MacOS

on:
  workflow_call:
    inputs:
      configuration:
        description: "Release signs with the Developer ID and notarizes, Debug is ad-hoc signed"
        required: true
        type: string

jobs:
  buildMac:
    name: Build on MacOS ${{ matrix.arch }}
    # The Homebrew enchant bottle only runs on the macOS major it was built
    # for, so the runner version sets the minimum macOS version of the app.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Install System Packages
        run: |
          brew install enchant

      - name: Install UV and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --no-dev --group build

      - name: Download Assets
        uses: actions/download-artifact@v8
        with:
          name: nw-assets
          path: novelwriter/assets

      - name: Check Signing Secrets
        if: inputs.configuration == 'Release'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do
            if [[ -z "${!name}" ]]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done

      - name: Import Signing Certificate
        if: inputs.configuration == 'Release'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "NW_KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          NW_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$NW_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$NW_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$NW_KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$NW_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$NW_KEYCHAIN"
          security list-keychain -d user -s "$NW_KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Store Notarization Credentials
        if: inputs.configuration == 'Release'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials headbright-signs \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --keychain "$NW_KEYCHAIN"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Build App Bundle
        id: build
        run: |
          echo "BUILD_VERSION=$(uv run --no-sync pkgutils.py version)" >> $GITHUB_OUTPUT
          ./setup/macos/build.sh ${{ inputs.configuration }}

      - name: Remove Signing Keychain
        if: always() && inputs.configuration == 'Release'
        run: |
          if [[ -f "$NW_KEYCHAIN" ]]; then
            security delete-keychain "$NW_KEYCHAIN"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: novelWriter-${{ steps.build.outputs.BUILD_VERSION }}-MacOS-${{ matrix.arch }}
          path: dist_macos/*.zip*
          if-no-files-found: error
          retention-days: 14
