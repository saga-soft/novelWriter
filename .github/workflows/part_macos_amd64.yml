name: Part MacOS AMD64

on: workflow_call

jobs:
  buildMac-AMD64:
    name: Build on MACOS AMD64
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      PYTHON_VERSION: "3.13"
      PACKAGE_ARCH: x86_64
      MINICONDA_ARCH: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: nw-assets
          path: novelwriter/assets

      - name: Build App Bundle
        id: build
        run: |
          echo "BUILD_VERSION=$(python pkgutils.py version)" >> $GITHUB_OUTPUT
          ./setup/macos/build.sh $PYTHON_VERSION $PACKAGE_ARCH $MINICONDA_ARCH

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: novelWriter-${{ steps.build.outputs.BUILD_VERSION }}-MacOS-AMD64-DMG
          path: dist_macos/*.dmg*
          if-no-files-found: error
          retention-days: 14
