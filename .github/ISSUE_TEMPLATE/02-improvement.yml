name: Suggest Improvement
description: Suggest something that can be improved.
title: "[Improve] "
labels: ["enhancement", "triage"]
type: feature
body:
  - type: markdown
    attributes:
      value: >
        Thank you for taking the time to fill out this feature request.
        Note that feature requests without a description will not be considered.
        Please also check if a request already exists for this feature.

  - type: textarea
    id: problem
    attributes:
      label: The Problem
      description: >
        Explain the problem you're facing.
        Include screenshots where relevant.
      placeholder: Tell us about the issue.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Your Suggestion
      description: >
        Provide a clear and concise description of what you'd like to see.
        Include screenshots where relevant.
      placeholder: Tell us what you need.
    validations:
      required: true
