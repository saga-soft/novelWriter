[Main]
name   = "Gruvbox Dark"
mode   = "dark"
author = "sobjey9"
credit = "Pavel Pertsev"
url    = "https://github.com/morhetz/gruvbox"

[Base]
base    = "#282828"
default = "#ebdbb2"
faded   = "#928374"
red     = "#cc241d"
orange  = "#d65d0e"
yellow  = "#d79921"
green   = "#98971a"
cyan    = "#689d6a"
blue    = "#458588"
purple  = "#b16286"

[Project]
root     = "default"
folder   = "red"
file     = "default"
title    = "cyan"
chapter  = "purple"
scene    = "#fb4934"
note     = "yellow"
active   = "cyan"
inactive = "red"
disabled = "faded"

[Icon]
tool      = "default"
sidebar   = "default"
accept    = "cyan"
reject    = "red"
action    = "blue"
option    = "yellow"
apply     = "cyan"
create    = "yellow"
destroy   = "faded"
reset     = "cyan"
add       = "cyan"
change    = "cyan"
remove    = "red"
shortcode = "yellow"
markdown  = "default"
system    = "yellow"
info      = "blue"
warning   = "yellow"
error     = "red"

[Palette]
window          = "#1d2021"
windowText      = "default"
base            = "base"
alternateBase   = "#3c3836"
text            = "default"
tooltipBase     = "yellow"
tooltipText     = "base"
button          = "base"
buttonText      = "default"
brightText      = "base"
highlight       = "purple"
highlightedText = "default"
link            = "blue"
linkVisited     = "blue"
accent          = "purple"

[GUI]
helpText     = "faded:L125"
fadedText    = "faded"
errorText    = "red"
accentText   = "cyan"
activeButton = "purple:96"
activeBase   = "base"
searchMatch  = "yellow:80"

[Syntax]
background     = "base"
text           = "default"
line           = "#3c3836"
link           = "blue"
headerText     = "cyan"
headerTag      = "cyan:128"
emphasis       = "purple:L105"
whitespace     = "purple:64"
dialog         = "cyan"
altDialog      = "blue"
note           = "yellow"
hidden         = "faded"
shortcode      = "yellow"
keyword        = "#fb4934"
tag            = "yellow"
value          = "faded"
optional       = "faded"
spellCheckLine = "red"
errorLine      = "blue"
replaceTag     = "yellow"
modifier       = "red"
textHighlight  = "#504945"